[workspace]
name = "msa-xp-experiments"
channels = ["conda-forge"]
platforms = ["osx-arm64", { name = "linux-64-cuda", platform = "linux-64", cuda = "13.0" }]

[dependencies]
python = "3.13.*"
numpy = ">=2.5.4"
scipy = ">=1.18.1"
mpmath = "<1.4"

[pypi-dependencies]
masked-stellar-autoencoder = { path = "../..", editable = true }
torchregress = { git = "https://github.com/sfabbro/torchregress.git", rev = "82ca1996cc4f3ca0be3e730d38a99db482a79378" }
gaiaxpy = "==2.1.2"
pytest = "*"
ruff = "*"
zuko = ">=1.6.0, <2"

[target.osx-arm64.dependencies]
pytorch = ">=2.14.1"

[target."*-cuda".pypi-dependencies]
torch = { version = ">=2.14.1", index = "https://download.pytorch.org/whl/cu130" }
