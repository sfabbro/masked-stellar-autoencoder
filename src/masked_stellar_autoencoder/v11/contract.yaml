defaults:
  max_error_mag: 0.5        # magnitude bands: larger quoted errors -> absent
  min_error_mag: 0.0        # quoted error <= this -> error treated as unknown (NaN)

# ---------------------------------------------------------------------------------
# Column contracts. Value specs:
#   value: <col>                          magnitude column
#   flux_nmgy: <col> + ivar_nmgy: <col>   nanomaggy flux and inverse variance (AB, ZP 22.5)
#   value: <col>, index: k                k-th element of a list column
# error specs: error: <col> | error_flux_over_error: <col> | error_index: k
# where: {column, equals}                 band valid only where column == value
# A list of specs coalesces: the first usable value wins.
# Quality rules (survey `quality` or band `quality`):
#   {column, rule: in, values: [...]}         value in set
#   {column, rule: bits_none, mask: int}      (value & mask) == 0
#   {column, rule: bits_any, mask: int}       (value & mask) != 0
#   {column, rule: range, min: x, max: y}     min <= value <= max (either bound optional)
#   {column, rule: char_in, index: k, values: "ABC"}   k-th character in the set
# bright_limit / faint_limit (mag): values outside -> absent (saturation, depth).
# `verified: false` marks a mapping not yet checked against the real schema; the loader
# refuses it unless data.allow_unverified_columns is true.
# ---------------------------------------------------------------------------------
contracts:
  gaia_keyed_v1a:
    description: >
      MSA-IN v1a (data.md 2.7): Gaia DR3 HATS anchor with partition-aligned trees
      joined on source_id: dr3_xp_continuous and the Gaia-keyed adql_matches tables
      (2MASS, PS1, SDSS, CatWISE) and SkyMapper DR4 Gaia ids, re-partitioned to the Gaia
      layout, plus SFD E(B-V). Native column names of each source.
    xp:
      coefficients: {bp: bp_coefficients, rp: rp_coefficients}
      errors: {bp: bp_coefficient_errors, rp: rp_coefficient_errors}
      correlations: {bp: bp_coefficient_correlations, rp: rp_coefficient_correlations}
      g_mag: phot_g_mean_mag
    surveys:
      gaia:
        bands:
          gaia_g: {value: phot_g_mean_mag, error_flux_over_error: phot_g_mean_flux_over_error}
          gaia_bp: {value: phot_bp_mean_mag, error_flux_over_error: phot_bp_mean_flux_over_error}
          gaia_rp: {value: phot_rp_mean_mag, error_flux_over_error: phot_rp_mean_flux_over_error}
      gaia_astrometry:
        bands:
          parallax: {value: parallax, error: parallax_error}
          pmra: {value: pmra, error: pmra_error}
          pmdec: {value: pmdec, error: pmdec_error}
      sfd:
        bands:
          sfd_ebv: {value: sfd_ebv}
      sdss:
        bands:
          sdss_u: {value: u, error: err_u, bright_limit: 14.0, quality: [{column: flags_u, rule: bits_none, mask: 262144}]}
          sdss_g: {value: g, error: err_g, bright_limit: 14.0, quality: [{column: flags_g, rule: bits_none, mask: 262144}]}
          sdss_r: {value: r, error: err_r, bright_limit: 14.0, quality: [{column: flags_r, rule: bits_none, mask: 262144}]}
          sdss_i: {value: i, error: err_i, bright_limit: 14.0, quality: [{column: flags_i, rule: bits_none, mask: 262144}]}
          sdss_z: {value: z, error: err_z, bright_limit: 14.0, quality: [{column: flags_z, rule: bits_none, mask: 262144}]}
      skymapper:
        quality: [{column: flags, rule: range, max: 3}]
        bands:
          skymapper_u: {value: u_psf, error: e_u_psf}
          skymapper_v: {value: v_psf, error: e_v_psf}
          skymapper_g: {value: g_psf, error: e_g_psf}
          skymapper_r: {value: r_psf, error: e_r_psf}
          skymapper_i: {value: i_psf, error: e_i_psf}
          skymapper_z: {value: z_psf, error: e_z_psf}
      ps1:
        quality: [{column: quality_flag, rule: bits_any, mask: 12}]
        bands:
          ps1_g: {value: g_mean_psf_mag, error: g_mean_psf_mag_error, bright_limit: 14.0}
          ps1_r: {value: r_mean_psf_mag, error: r_mean_psf_mag_error, bright_limit: 14.0}
          ps1_i: {value: i_mean_psf_mag, error: i_mean_psf_mag_error, bright_limit: 14.0}
          ps1_z: {value: z_mean_psf_mag, error: z_mean_psf_mag_error, bright_limit: 13.5}
          ps1_y: {value: y_mean_psf_mag, error: y_mean_psf_mag_error, bright_limit: 13.0}
      twomass:
        bands:
          tmass_j: {value: j_m, error: j_msigcom, quality: [{column: ph_qual, rule: char_in, index: 0, values: ABC}]}
          tmass_h: {value: h_m, error: h_msigcom, quality: [{column: ph_qual, rule: char_in, index: 1, values: ABC}]}
          tmass_ks: {value: ks_m, error: ks_msigcom, quality: [{column: ph_qual, rule: char_in, index: 2, values: ABC}]}
      catwise:
        bands:
          catwise_w1: {value: w1mpro, error: w1sigmpro}
          catwise_w2: {value: w2mpro, error: w2sigmpro}

  gaia_master_v2:
    description: >
      MSA-IN v2 (data.md 2.7): the Gaia-anchored full-wavelength master written by
      xmatcher ray-anchor (docs/gaia-master-data.md). Survey columns carry the suffix
      _<tag>, where tag is the resolved xmatcher catalogue name (xmatcher
      docs/ray-anchor.md); `{tag}` in a column name is replaced by the survey tag below
      (overridable in the run config: data.survey_tags). Each survey also has
      <tag>_quality (good, poor, ambiguous, pm_warn, ambiguous+pm_warn, no_match).
      XP stays a sidecar tree (dr3_xp_continuous), joined on source_id.
    xp:
      coefficients: {bp: bp_coefficients, rp: rp_coefficients}
      errors: {bp: bp_coefficient_errors, rp: rp_coefficient_errors}
      correlations: {bp: bp_coefficient_correlations, rp: rp_coefficient_correlations}
      g_mag: phot_g_mean_mag
    surveys:
      gaia:
        bands:
          gaia_g: {value: phot_g_mean_mag, error_flux_over_error: phot_g_mean_flux_over_error}
          gaia_bp: {value: phot_bp_mean_mag, error_flux_over_error: phot_bp_mean_flux_over_error}
          gaia_rp: {value: phot_rp_mean_mag, error_flux_over_error: phot_rp_mean_flux_over_error}
      gaia_astrometry:
        bands:
          parallax: {value: parallax, error: parallax_error}
          pmra: {value: pmra, error: pmra_error}
          pmdec: {value: pmdec, error: pmdec_error}
      sfd:
        bands:
          sfd_ebv: {value: sfd_ebv}
      galex:
        tag: galex_guvcat_ais
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          galex_fuv: {value: "fuv_mag_{tag}", error: "fuv_magerr_{tag}", quality: [{column: "fuv_artifact_{tag}", rule: bits_none, mask: -1}]}
          galex_nuv: {value: "nuv_mag_{tag}", error: "nuv_magerr_{tag}", quality: [{column: "nuv_artifact_{tag}", rule: bits_none, mask: -1}]}
      sdss:
        tag: sdss_dr16_photoprimary
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          sdss_u: {flux_nmgy: "PSFFLUX_u_{tag}", ivar_nmgy: "PSFFLUX_IVAR_u_{tag}", bright_limit: 14.0}
          sdss_g: {flux_nmgy: "PSFFLUX_g_{tag}", ivar_nmgy: "PSFFLUX_IVAR_g_{tag}", bright_limit: 14.0}
          sdss_r: {flux_nmgy: "PSFFLUX_r_{tag}", ivar_nmgy: "PSFFLUX_IVAR_r_{tag}", bright_limit: 14.0}
          sdss_i: {flux_nmgy: "PSFFLUX_i_{tag}", ivar_nmgy: "PSFFLUX_IVAR_i_{tag}", bright_limit: 14.0}
          sdss_z: {flux_nmgy: "PSFFLUX_z_{tag}", ivar_nmgy: "PSFFLUX_IVAR_z_{tag}", bright_limit: 14.0}
      skymapper:
        tag: skymapper_dr4_hats
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
          - {column: "flags_{tag}", rule: range, max: 3}
        bands:
          skymapper_u: {value: "u_psf_{tag}", error: "e_u_psf_{tag}"}
          skymapper_v: {value: "v_psf_{tag}", error: "e_v_psf_{tag}"}
          skymapper_g: {value: "g_psf_{tag}", error: "e_g_psf_{tag}"}
          skymapper_r: {value: "r_psf_{tag}", error: "e_r_psf_{tag}"}
          skymapper_i: {value: "i_psf_{tag}", error: "e_i_psf_{tag}"}
          skymapper_z: {value: "z_psf_{tag}", error: "e_z_psf_{tag}"}
      ps1:
        tag: ps1_otmo
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
          - {column: "qualityFlag_{tag}", rule: bits_any, mask: 12}
          - {column: "nDetections_{tag}", rule: range, min: 2}
        bands:
          ps1_g: {value: "gMeanPSFMag_{tag}", error: "gMeanPSFMagErr_{tag}", bright_limit: 14.0}
          ps1_r: {value: "rMeanPSFMag_{tag}", error: "rMeanPSFMagErr_{tag}", bright_limit: 14.0}
          ps1_i: {value: "iMeanPSFMag_{tag}", error: "iMeanPSFMagErr_{tag}", bright_limit: 14.0}
          ps1_z: {value: "zMeanPSFMag_{tag}", error: "zMeanPSFMagErr_{tag}", bright_limit: 13.5}
          ps1_y: {value: "yMeanPSFMag_{tag}", error: "yMeanPSFMagErr_{tag}", bright_limit: 13.0}
      ls_dr11:
        tag: ls_dr11_sweep
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          ls_s_g: {flux_nmgy: "FLUX_G_{tag}", ivar_nmgy: "FLUX_IVAR_G_{tag}", where: {column: "PHOTSYS_{tag}", equals: S}}
          ls_s_r: {flux_nmgy: "FLUX_R_{tag}", ivar_nmgy: "FLUX_IVAR_R_{tag}", where: {column: "PHOTSYS_{tag}", equals: S}}
          ls_s_i: {flux_nmgy: "FLUX_I_{tag}", ivar_nmgy: "FLUX_IVAR_I_{tag}", where: {column: "PHOTSYS_{tag}", equals: S}}
          ls_s_z: {flux_nmgy: "FLUX_Z_{tag}", ivar_nmgy: "FLUX_IVAR_Z_{tag}", where: {column: "PHOTSYS_{tag}", equals: S}}
          ls_n_g: {flux_nmgy: "FLUX_G_{tag}", ivar_nmgy: "FLUX_IVAR_G_{tag}", where: {column: "PHOTSYS_{tag}", equals: N}}
          ls_n_r: {flux_nmgy: "FLUX_R_{tag}", ivar_nmgy: "FLUX_IVAR_R_{tag}", where: {column: "PHOTSYS_{tag}", equals: N}}
          ls_n_z: {flux_nmgy: "FLUX_Z_{tag}", ivar_nmgy: "FLUX_IVAR_Z_{tag}", where: {column: "PHOTSYS_{tag}", equals: N}}
          ls_w1: {flux_nmgy: "FLUX_W1_{tag}", ivar_nmgy: "FLUX_IVAR_W1_{tag}"}
          ls_w2: {flux_nmgy: "FLUX_W2_{tag}", ivar_nmgy: "FLUX_IVAR_W2_{tag}"}
          ls_w3: {flux_nmgy: "FLUX_W3_{tag}", ivar_nmgy: "FLUX_IVAR_W3_{tag}"}
          ls_w4: {flux_nmgy: "FLUX_W4_{tag}", ivar_nmgy: "FLUX_IVAR_W4_{tag}"}
      des:
        tag: des_y6_gold
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
          - {column: "FLAGS_GOLD_{tag}", rule: bits_none, mask: -1}
        bands:
          des_g: {value: "WAVG_MAG_PSF_G_{tag}", error: "WAVG_MAGERR_PSF_G_{tag}", bright_limit: 16.0}
          des_r: {value: "WAVG_MAG_PSF_R_{tag}", error: "WAVG_MAGERR_PSF_R_{tag}", bright_limit: 16.0}
          des_i: {value: "WAVG_MAG_PSF_I_{tag}", error: "WAVG_MAGERR_PSF_I_{tag}", bright_limit: 16.0}
          des_z: {value: "WAVG_MAG_PSF_Z_{tag}", error: "WAVG_MAGERR_PSF_Z_{tag}", bright_limit: 16.0}
          des_y: {value: "WAVG_MAG_PSF_Y_{tag}", error: "WAVG_MAGERR_PSF_Y_{tag}", bright_limit: 15.5}
      delve:
        tag: delve_dr3_gold
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
          - {column: "FLAGS_GOLD_{tag}", rule: bits_none, mask: -1}
        bands:
          delve_g: {value: "WAVG_MAG_PSF_G_{tag}", error: "WAVG_MAGERR_PSF_G_{tag}", bright_limit: 16.0}
          delve_r: {value: "WAVG_MAG_PSF_R_{tag}", error: "WAVG_MAGERR_PSF_R_{tag}", bright_limit: 16.0}
          delve_i: {value: "WAVG_MAG_PSF_I_{tag}", error: "WAVG_MAGERR_PSF_I_{tag}", bright_limit: 16.0}
          delve_z: {value: "WAVG_MAG_PSF_Z_{tag}", error: "WAVG_MAGERR_PSF_Z_{tag}", bright_limit: 16.0}
      splus:
        tag: splus_dr4_dual
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          splus_u: {value: "u_auto_{tag}", error: "e_u_auto_{tag}"}
          splus_j0378: {value: "j0378_auto_{tag}", error: "e_j0378_auto_{tag}"}
          splus_j0395: {value: "j0395_auto_{tag}", error: "e_j0395_auto_{tag}"}
          splus_j0410: {value: "j0410_auto_{tag}", error: "e_j0410_auto_{tag}"}
          splus_j0430: {value: "j0430_auto_{tag}", error: "e_j0430_auto_{tag}"}
          splus_g: {value: "g_auto_{tag}", error: "e_g_auto_{tag}"}
          splus_j0515: {value: "j0515_auto_{tag}", error: "e_j0515_auto_{tag}"}
          splus_r: {value: "r_auto_{tag}", error: "e_r_auto_{tag}"}
          splus_j0660: {value: "j0660_auto_{tag}", error: "e_j0660_auto_{tag}"}
          splus_i: {value: "i_auto_{tag}", error: "e_i_auto_{tag}"}
          splus_j0861: {value: "j0861_auto_{tag}", error: "e_j0861_auto_{tag}"}
          splus_z: {value: "z_auto_{tag}", error: "e_z_auto_{tag}"}
      jplus:
        tag: jplus_dr3
        # MAG_AUTO / MAG_ERR_AUTO are 12-element arrays; the element order below has not
        # been checked against the DR3 MagABDualObj schema.
        verified: false
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          jplus_ujava: {value: "MAG_AUTO_{tag}", index: 0, error: "MAG_ERR_AUTO_{tag}", error_index: 0}
          jplus_j0378: {value: "MAG_AUTO_{tag}", index: 1, error: "MAG_ERR_AUTO_{tag}", error_index: 1}
          jplus_j0395: {value: "MAG_AUTO_{tag}", index: 2, error: "MAG_ERR_AUTO_{tag}", error_index: 2}
          jplus_j0410: {value: "MAG_AUTO_{tag}", index: 3, error: "MAG_ERR_AUTO_{tag}", error_index: 3}
          jplus_j0430: {value: "MAG_AUTO_{tag}", index: 4, error: "MAG_ERR_AUTO_{tag}", error_index: 4}
          jplus_g: {value: "MAG_AUTO_{tag}", index: 5, error: "MAG_ERR_AUTO_{tag}", error_index: 5}
          jplus_j0515: {value: "MAG_AUTO_{tag}", index: 6, error: "MAG_ERR_AUTO_{tag}", error_index: 6}
          jplus_r: {value: "MAG_AUTO_{tag}", index: 7, error: "MAG_ERR_AUTO_{tag}", error_index: 7}
          jplus_j0660: {value: "MAG_AUTO_{tag}", index: 8, error: "MAG_ERR_AUTO_{tag}", error_index: 8}
          jplus_i: {value: "MAG_AUTO_{tag}", index: 9, error: "MAG_ERR_AUTO_{tag}", error_index: 9}
          jplus_j0861: {value: "MAG_AUTO_{tag}", index: 10, error: "MAG_ERR_AUTO_{tag}", error_index: 10}
          jplus_z: {value: "MAG_AUTO_{tag}", index: 11, error: "MAG_ERR_AUTO_{tag}", error_index: 11}
      pristine:
        tag: pristine_dr2
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          pristine_cahk0: {value: "CaHK_0_{tag}", error: "d_CaHK_{tag}"}
      twomass:
        tag: twomass_psc_hats
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          tmass_j: {value: "j_m_{tag}", error: "j_msigcom_{tag}", quality: [{column: "ph_qual_{tag}", rule: char_in, index: 0, values: ABC}]}
          tmass_h: {value: "h_m_{tag}", error: "h_msigcom_{tag}", quality: [{column: "ph_qual_{tag}", rule: char_in, index: 1, values: ABC}]}
          tmass_ks: {value: "k_m_{tag}", error: "k_msigcom_{tag}", quality: [{column: "ph_qual_{tag}", rule: char_in, index: 2, values: ABC}]}
      uhs:
        tag: uhs_dr3
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          uhs_j: {value: "japermag3_{tag}", error: "japermag3err_{tag}"}
          uhs_k: {value: "kapermag3_{tag}", error: "kapermag3err_{tag}"}
      vhs:
        tag: vhs_dr7
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          vhs_j: {value: "japermag3_{tag}", error: "japermag3err_{tag}"}
          vhs_h: {value: "hapermag3_{tag}", error: "hapermag3err_{tag}"}
          vhs_ks: {value: "ksapermag3_{tag}", error: "ksapermag3err_{tag}"}
      ukidss:
        # LAS first, then GCS (disjoint footprints); each spec checks its own match.
        tag: ukidss_dr11_las
        tag2: ukidss_dr11_gcs
        bands:
          ukidss_z:
            - {value: "zapermag3_{tag2}", error: "zapermag3err_{tag2}", quality: [{column: "{tag2}_quality", rule: in, values: [good, poor, pm_warn]}]}
          ukidss_y:
            - {value: "yapermag3_{tag}", error: "yapermag3err_{tag}", quality: [{column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}]}
            - {value: "yapermag3_{tag2}", error: "yapermag3err_{tag2}", quality: [{column: "{tag2}_quality", rule: in, values: [good, poor, pm_warn]}]}
          ukidss_j:
            - {value: "japermag3_{tag}", error: "japermag3err_{tag}", quality: [{column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}]}
            - {value: "japermag3_{tag2}", error: "japermag3err_{tag2}", quality: [{column: "{tag2}_quality", rule: in, values: [good, poor, pm_warn]}]}
          ukidss_h:
            - {value: "hapermag3_{tag}", error: "hapermag3err_{tag}", quality: [{column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}]}
            - {value: "hapermag3_{tag2}", error: "hapermag3err_{tag2}", quality: [{column: "{tag2}_quality", rule: in, values: [good, poor, pm_warn]}]}
          ukidss_k:
            - {value: "kapermag3_{tag}", error: "kapermag3err_{tag}", quality: [{column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}]}
            - {value: "kapermag3_{tag2}", error: "kapermag3err_{tag2}", quality: [{column: "{tag2}_quality", rule: in, values: [good, poor, pm_warn]}]}
      viking:
        tag: viking_dr5
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          viking_z: {value: "zapermag3_{tag}", error: "zapermag3err_{tag}"}
          viking_y: {value: "yapermag3_{tag}", error: "yapermag3err_{tag}"}
          viking_j: {value: "japermag3_{tag}", error: "japermag3err_{tag}"}
          viking_h: {value: "hapermag3_{tag}", error: "hapermag3err_{tag}"}
          viking_ks: {value: "ksapermag3_{tag}", error: "ksapermag3err_{tag}"}
      vvvx:
        tag: vvvx_dr1
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          vvvx_j: {value: "japermag3_{tag}", error: "japermag3err_{tag}"}
          vvvx_h: {value: "hapermag3_{tag}", error: "hapermag3err_{tag}"}
          vvvx_ks: {value: "ksapermag3_{tag}", error: "ksapermag3err_{tag}"}
      catwise:
        tag: catwise2020_catalog
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          catwise_w1: {value: "w1mpro_{tag}", error: "w1sigmpro_{tag}"}
          catwise_w2: {value: "w2mpro_{tag}", error: "w2sigmpro_{tag}"}
      allwise:
        tag: allwise_hats
        quality:
          - {column: "{tag}_quality", rule: in, values: [good, poor, pm_warn]}
        bands:
          allwise_w3: {value: "w3mpro_{tag}", error: "w3sigmpro_{tag}", quality: [{column: "ph_qual_{tag}", rule: char_in, index: 2, values: ABC}]}
          allwise_w4: {value: "w4mpro_{tag}", error: "w4sigmpro_{tag}", quality: [{column: "ph_qual_{tag}", rule: char_in, index: 3, values: ABC}]}
