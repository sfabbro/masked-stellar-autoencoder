# MSA v11 input contract: canonical bands (UV -> mid-IR) and, per column contract, how
# each band is read from a table. Loaded and validated by
# masked_stellar_autoencoder.v11.schema (unknown keys fail). Adding a band, a survey or a
# column mapping is an edit here, not a code change; checkpoints key band embeddings by
# band name, so a model trained on fewer bands loads into a longer band list.
#
# Units: magnitudes (system per band), XP coefficients in raw Gaia units (e-/s) that the
# loader divides by f_G = 10**((8.5 - G) / 2.5), parallax in mas, proper motions in mas/yr,
# SFD E(B-V) in mag. Errors are 1-sigma in the same units. An absent or unusable value
# is NaN: the band is simply absent for that star (no fill token).
#
# wavelength_nm: pivot wavelength. For bands with an `svo` curve it is the pivot of that
# curve (tests check agreement within 1 %); otherwise the instrument's published pivot.
# fi: filter-integral passband. `xp_system: "<torchgaiaxp system>:<band>"` uses
# torchgaiaxp 0.3.0's packaged design; `svo` alone integrates the stored SVO curve with
# XPSpectra.integrate. Whether a band joins the filter-integral term is decided from its
# SVO curve support (config filter_integral.wavelength_range_nm / support_threshold).

version: msa-in-v2-draft-1

kinds: [mag, xp, cond]

surveys:
  gaia: {description: "Gaia DR3 G, BP, RP (Riello+2021)"}
  gaia_xp: {description: "Gaia DR3 XP continuous mean spectra, 55 BP + 55 RP coefficients"}
  gaia_astrometry: {description: "Gaia DR3 parallax and proper motion (conditioning only)"}
  sfd: {description: "SFD98 E(B-V) at the Gaia position (conditioning only)"}
  galex: {description: "GALEX GUVcat AIS GR6/7"}
  sdss: {description: "SDSS DR13/DR16 imaging (photoPrimary)"}
  skymapper: {description: "SkyMapper DR4"}
  ps1: {description: "Pan-STARRS1 DR2 mean PSF photometry"}
  ls_dr11: {description: "Legacy Surveys DR11 (PHOTSYS S = DECam, N = BASS/MzLS) and forced unWISE"}
