# Map family per added source, from master_label_overlap_20261110_v1 via
# training/map_policy.py (scripts/write_master_label_sidecars.py manifest).
source_map_kinds:
  sdss_dr19_aspcap_sdss5: offset
  sdss_dr12_sspp: spline
  gaia_eso_dr5_1: spline
  s5_dr1: offset
  pigs_aat: offset
  lamost_vmp_li2018: spline
  lamost_cat_li2025: offset
  pristine_aguado2019: offset
  smss_dacosta2019: offset
  bestbrightest_placco2019: offset
  highres_literature: offset
  # Staged surveys whose [Fe/H] overlap needs curvature (metal-poor compression).
  # gaia_dr3_gspspec has no Fe/H overlap and keeps the selected decision family.
  lamost_dr12v2_lrs_lasp: spline
  lamost_dr12v2_mrs_lasp: spline
  sdss_dr20_bossnet_081: spline
  rave_dr6_madera_gauguin: spline
  # Loose-cut groups (stars not in the staged groups; S/N >= 10). Millions of
  # rows each, overlapping the staged and high-res sources: own spline maps,
  # so lower-S/N systematics are not forced onto the staged survey maps.
  lamost_dr12v2_lrs_lasp_ext: spline
  lamost_dr12v2_mrs_lasp_ext: spline
  sdss_dr20_bossnet_081_ext: spline
  desi_rvs_ext_corrected: spline
  desi_rvs_ext_uncorrected: spline
  # Declared-quantity chemistry groups (training/quantity_kinds.py): the common
  # [Fe/H]/[alpha/Fe] draws are converted to [M/H]/[alpha/M] (Salaris) before
  # these maps; [Mg/Fe] is related to [alpha/Fe] by its own map only.
  gaia_dr3_gspspec_chem: spline
  apogee_dr17_alpha_m: affine
  galah_dr4_mg_fe: affine
  lamost_dr12v2_lrs_alpha_m: affine
  lamost_dr12v2_mrs_alpha_m: affine
  sdss_dr12_sspp_alpha_fe: affine
  sdss_dr19_aspcap_sdss5_alpha_m: affine
  # Census v6 groups: small reference/dSph sets keep an offset; MaStar
  # (24k stars, wide overlap) and AMBRE [M/H] get affine and offset maps.
  highres_literature_extra: offset
  kirby2010_dsph: offset
  mastar_params: affine
  ambre_feros_chem: offset
# XP-only run: stars without XP take no role (trainer ``xp_only``); no XP
# dropout, no XP-hidden selection, no no-XP reconstruction rows.
xp_only: true
supervised_xp_dropout: 0.0
selection_xp_hidden_weight: 0.0
# Full encoder inputs (all 140 pretraining slots from the staged catalogues,
# NaN storage + visible mask), all-column reconstruction including genuine
# no-XP Gaia rows, and metadata context for the heads (zero-initialised).
trainer_input_profile: full_inputs_measured_parallax
reconstruction_columns: all
# Reconstruction on the 150M-row XP cache (all input columns), 1024 rows per
# step: with ~20M FIT records per epoch (batch 256) two epochs draw ~150M rows.
reconstruction_loss_weight: 0.05
head_context: true
