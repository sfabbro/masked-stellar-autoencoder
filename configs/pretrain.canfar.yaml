model:
  layer_dims: [2048, 2048, 1024, 1024, 512, 512, 256, 256]
  pt_activ_func: 'elu'
  norm: 'layer'
  rtdl_embed: 16
  decoder_dims: [256, 512, 1024]
  encoder_type: 'resnet'
  growth_rate: 64
  num_dense_layers: 8
  cosine_latent: false

training:
  xp_masking_ratio: 0.9
  m_masking_ratio: 0.6
  mask_mixture_xp_full_frac: 0.0
  lr: 0.00001
  weight_decay: 0.00001
  lasso: 0
  optimizer: 'adamw'
  loss_fn: 'mae'
  heteroscedastic: false
  pert_ebv_scale: 1.0
  mini_batch_size: 32768
  epochs: 100
  # Set MSA_PRETRAIN_RESUME to a full checkpoint to continue an interrupted run.
  presaved: '$MSA_PRETRAIN_RESUME'
  scheduler_cosine_t0: 10
  scheduler_cosine_t_mult: 2
  scheduler_eta_min_factor: 0.01

saving:
  model_str: '$MSA_PRETRAIN_CHECKPOINT'
  log_file: '$MSA_PRETRAIN_OUTPUT_DIR/pretrain.log'
  metrics_file: '$MSA_PRETRAIN_OUTPUT_DIR/metrics.jsonl'
  residual_stats_file: '$MSA_PRETRAIN_OUTPUT_DIR/residual_stats.jsonl'
  checkpoint_interval: 2
  arc_checkpoint_dir: '$MSA_PRETRAIN_CHECKPOINT_DIR'
  arc_sync_interval: 5
