                 'bp_36','bp_37','bp_38','bp_39','bp_40','bp_41','bp_42','bp_43',
                 'bp_44','bp_45','bp_46','bp_47','bp_48','bp_49','bp_50','bp_51',
                 'bp_52','bp_53','bp_54','bp_55','rp_1','rp_2','rp_3','rp_4',
                 'rp_5','rp_6','rp_7','rp_8','rp_9','rp_10','rp_11','rp_12',
                 'rp_13','rp_14','rp_15','rp_16','rp_17','rp_18','rp_19','rp_20',
                 'rp_21','rp_22','rp_23','rp_24','rp_25','rp_26','rp_27','rp_28',
                 'rp_29','rp_30','rp_31','rp_32','rp_33','rp_34','rp_35','rp_36',
                 'rp_37','rp_38','rp_39','rp_40','rp_41','rp_42','rp_43','rp_44',
                 'rp_45','rp_46','rp_47','rp_48','rp_49','rp_50','rp_51','rp_52',
                 'rp_53','rp_54','rp_55','U_SMSS','V_SMSS','G_SMSS','R_SMSS','I_SMSS',
                 'Z_SMSS','U_SDSS','G_SDSS','R_SDSS','I_SDSS','Z_SDSS','G_PS1','R_PS1',
                 'I_PS1','Z_PS1','Y_PS1','J','H','KS','PARALLAX','EBV']
  ft_datafile: $MSA_FINETUNE_DATA
  classes:
  - teff
  - e_teff
  - logg
  - e_logg
  - fe_h
  - e_fe_h
  - alpha
  - e_alpha
  - age
  - e_age
model:
  layer_dims:
  - 2048
  - 2048
  - 1024
  - 1024
  - 512
  - 512
  - 256
  - 256
  pt_activ_func: elu
  norm: layer
  rtdl_embed: 16
  saved_weights: $MSA_PRETRAIN_CHECKPOINT
  decoder_dims:
  - 256
  - 512
  - 1024
  encoder_type: resnet
  growth_rate: 64
  num_dense_layers: 8
  cosine_latent: false
training:
  xp_masking_ratio: 0.9
  m_masking_ratio: 0.6
  lr: 1.0e-05
  weight_decay: 1.0e-05
  lasso: 0
  optimizer: adamw
  loss_fn: mae
  mini_batch_size: 1024
  epochs: 100
preprocessing:
  astrometry_input_policy: snr_clipped
  astrometry_snr_cap: 10.0
  parallax_target_space: log10_mas
  parallax_floor_mas: 0.0001
finetuning:
  num_epochs: 101
  mini_batch: 512
  linearprobe: false
  mask: true
  multitask: true
  rncloss: false
  lr: 0.0001
  encoder_lr: null
  lr_scheduler_encoder_decay: 0.95
  lr_scheduler_head_decay: 0.5
  lr_scheduler_head_step_epochs: 10
  opt: adamw
  active: relu
  l2: 0.0
  lf: quantile
  pert_features: true
  pert_scale: 1.0
  pert_ebv_scale: 1.0
  pert_labels: false
  ensemble: true
  seed: 42
  pert_seed: 42
  # Set MSA_FINETUNE_RESUME to a fine-tune checkpoint; disable ensemble for full resume.
  ensemble_path: $MSA_FINETUNE_RESUME
  lambda_pred: 0.8
  lambda_rec: 0.2
  ensemble_seed: 42
  ensemble_size: 20
  quantile_label_weights: null
  metal_poor:
    stratify_feh: false
    feh_stratify_bins:
    - -10.0
    - -2.0
    - -1.0
    - 0.0
    - 10.0
    require_finite_e_fe_h: false
    max_e_fe_h: null
    min_teff: null
    max_teff: null
    augment_below_feh: null
    augment_fraction: 0.0
saving:
  model_str: $MSA_FINETUNE_CHECKPOINT
  log_file: $MSA_FINETUNE_OUTPUT_DIR/finetune.log
  checkpoint_interval: 1
