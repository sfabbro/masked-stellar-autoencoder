  datafile: $MSA_PRETRAIN_DATA
  valid_keys:
  - sslset11_part0
  - sslset14_part0
  - sslset2_part0
  - sslset5_part0
  - sslset20_part0
  feature_cols: ['W1','W2','G','BP','RP','bp_1','bp_2','bp_3',
                 'bp_4','bp_5','bp_6','bp_7','bp_8','bp_9','bp_10','bp_11',
