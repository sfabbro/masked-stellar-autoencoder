                 'rpe_53','rpe_54','rpe_55','E_U_SMSS','E_V_SMSS','E_G_SMSS','E_R_SMSS','E_I_SMSS',
                 'E_Z_SMSS','E_U_SDSS','E_G_SDSS','E_R_SDSS','E_I_SDSS','E_Z_SDSS','E_G_PS1','E_R_PS1',
                 'E_I_PS1','E_Z_PS1','E_Y_PS1','E_J','E_H','E_KS','e_parallax',null,
                 'e_pmra','e_pmdec',null,null]
