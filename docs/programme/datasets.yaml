# Machine-readable companion of docs/programme/data.md (section 3 and the paths of sections 1-2).
# Spec only: nothing here is implemented in code yet. Counts are from ARC manifests/headers read 2026-11-23;
# "est" marks planning estimates.

spec: msa-split-v1
date: 2026-11-23
status: frozen  # 2026-11-23, /arc/projects/astroai/msa/runs/msa_split_v1 (manifest status msa_split_v1_complete; salt 0xb6f6e5353645106b)

keys:
  precedence:
    - {kind: gaia_dr3, form: "<source_id>", type: int64}          # EDR3 == DR3 ids
    - {kind: gaia_dr4_new, form: "gdr4:<source_id>", type: str}   # DR4 sources without a DR3 counterpart
    - {kind: pensus_nongaia, form: "pensus:<survey>:<native_id>", type: str}
    - {kind: label_nogaia, form: "lbl:<survey>:<native_id>", type: str, rule: lexicographically smallest over the star's records}
  string_key_to_uint64: "int.from_bytes(sha256(key.encode())[:8], 'little') | 2**63"
  pensus_precedence: [ls_dr11, catwise2020, vhs_dr7, uhs_dr3, ps1_dr2, skymapper_dr4, des_y6_gold, delve_dr3_gold, twomass_psc, allwise]
  dr4_mapping:
    table: DR3->DR4 neighbourhood table published with DR4
    split_source: children inherit the DR3 key
    merged_sources: most held-out partition wins (TEST > CAL > DEV > FIT)
    record: key_route

hash:
  algorithm: splitmix64 finaliser on (key64 XOR SALT64)
  salt: msa-split-v1
  salt64: "0xb6f6e5353645106b"   # first 8 bytes (little-endian) of sha256(b"msa-split-v1")
  unit: "(z >> 11) * 2**-53"
  test_vectors:
    - {key: 4185355646116022528, u: 0.662500593453, partition: FIT}
    - {key: 4398046511104, u: 0.798229566688, partition: DEV}
    - {key: 4295806720, u: 0.852028592613, partition: CAL}
    - {key: 4295806753, u: 0.882257348434, partition: TEST}
    - {key: "grp:hr23:Melotte_22", u: 0.440677168076, partition: FIT}
  rec_subsample_salt: msa-rec-v1        # nested REC samples: unit(key, salt) < rate
  fit_folds: "floor(u / 0.15) for u < 0.75 (5 folds)"

partitions:          # upper edges of u
  FIT: 0.75
  DEV: 0.80
  CAL: 0.88
  TEST: 1.00

sets:
  FIT:
    definition: labelled AND P == FIT AND NOT reserved
    uses: [supervised_loss, label_model_fitting, scalers, conatal_training_terms]
  DEV:
    definition: labelled AND P == DEV AND NOT reserved
    uses: [early_stopping, model_selection, hyperparameters]
    forbidden: [calibration, final_reporting]
  CAL:
    definition: labelled AND P == CAL AND NOT reserved
    uses: [conformal, recalibration, neyman_critical_values]
    forbidden: [training, model_selection]
  TEST:
    definition: labelled AND P == TEST AND NOT reserved
    uses: [final_reporting]
    forbidden: [any_decision]
    inspection_log: required
  REC:
    definition: all universe objects with P == FIT AND NOT reserved (inputs only)
    uses: [self_supervised_reconstruction, pretraining, modality_dropout]
  REC_DEV:
    definition: all universe objects with P == DEV (inputs only)
    uses: [reconstruction_early_stopping]
  PRED:
    definition: whole universe (Gaia DR3, then DR4, then Pensus)
    uses: [inference]
  labelled:
    note: per target (spectroscopic, age, ebv, parallax) under the build's label policy; never changes the partition

input_classes:
  X: XP present
  P: no XP, >= 2 colours
  G: G only or G + astrometry (PRED only; flagged)
  supervised_minimum: G plus one colour (BP-RP or one external band)

groups:   # members inherit the partition of unit(group_key)
  open_clusters:
    catalogue: Hunt & Reffert 2023
    path: /arc/projects/k-pop/catalogues/OpenClusters/members.fits
    membership: p >= 0.7
    key: "grp:hr23:<Name>"
    size: {clusters: 7167, members_p_gt_0p5: 574116}
  wide_binaries:
    catalogue: El-Badry, Rix & Heintz 2021
    path: /arc/projects/astroai/msa/analysis/age_labels_20261122/wide_pairs_eb21.parquet
    membership: R_chance_align < 0.1
    key: "grp:eb21:<min(source_id1, source_id2)>"
    size: {pairs: 1256400}
  precedence: [open_clusters, wide_binaries]   # then highest membership probability, then smaller key

reserved:   # never FIT/DEV/CAL; excluded from REC; report-only
  gbs_v3: {path: /arc/projects/k-pop/catalogues/gaia_fgk_benchmarks.parquet, size: 192}
  globular_clusters:
    catalogue: Vasiliev & Baumgardt 2021
    path: [/arc/projects/k-pop/catalogues/gc_gaia/, /arc/projects/astroai/msa/analysis/age_labels_20261122/cluster_members_extra.parquet]
    membership: p >= 0.5
    size: {gcs_est: 170}
  age_benchmark_clusters: {path: /arc/projects/astroai/msa/analysis/age_labels_20261122/cluster_priors.csv, size: {clusters: 35}, members: HR23 p >= 0.7}
  kepler_legacy: {path: /arc/projects/k-pop/catalogues/kepler-legacy-dwarfs.fits, size: 66}
  wd_ms_pairs: {path: [/arc/projects/astroai/msa/analysis/age_labels_20261122/wdms_pairs.parquet, /arc/projects/astroai/msa/analysis/age_labels_20261122/wd_ages_published.parquet], size: {pairs: 16703}}

qa_sets:   # evaluated per partition: qa-dev (decisions ok), qa-cal, qa-test (final); reserved sets report-only
  QA-core: {rule: per star, definition: ">=1 fit_ok non-grid-edge [Fe/H] from multisurvey.fe_h_core surveys in master 20261113_v1; frozen id list", current: {v5_rows: 39073, held_out: 7740}}
  QA-mp: {rule: per star, definition: "QA-core [Fe/H] < -2 plus metal-poor survey stars", current: {highres_lt_m2: 3101, highres_lt_m3: 706, highres_lt_m4: 37}}
  QA-seis: {rule: per star, sources: [apokasc-3-2024.fits, apo_k2_2024.fits, apokasc-1-dwarfs.fits], current_reference_records: {apokasc3: 13871, apok2: 4660, apokasc_dwarfs: 413}}
  QA-irfm: {rule: per star, note: computed from input photometry; consistency only, current: 898839}
  QA-gbs: {rule: reserved, current: 192}
  QA-oc: {rule: per cluster, current_clusters: 7167}
  QA-gc: {rule: reserved}
  QA-wb: {rule: per pair, current_pairs: 1256400}
  QA-age: {rule: reserved, members: [age_benchmark_clusters, kepler_legacy, wd_ms_pairs]}
  QA-dist: {rule: per star or cluster, sources: [Hipparcos parallaxes, HR23 cluster parallaxes]}
  QA-ext: {rule: per star or cluster, sources: [SFD at |b| > 60 (not independent), cluster E(B-V)]}
  QA-loso: {rule: TEST only, code: pipeline/splits.py leave_one_survey_out}
  QA-noxp: {rule: TEST only, strata: [P, X_with_xp_hidden]}
  strata: [G_bin, feh_bin, teff_logg_regime, input_class, companion_labelled_or_not]

